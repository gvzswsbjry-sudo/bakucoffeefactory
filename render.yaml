services:
  - type: web
    name: baku-coffee-factory
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: baku-coffee-factory-db
          property: connectionString

databases:
  - name: baku-coffee-factory-db
    plan: free
    databaseName: baku_coffee_factory
    user: baku_coffee_factory

