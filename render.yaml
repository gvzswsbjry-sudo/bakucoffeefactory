services:
  - type: web
    name: baku-coffee-factory
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: baku-coffee-factory-db
          property: connectionString
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: TRUST_PROXY
        value: 1

databases:
  - name: baku-coffee-factory-db
    plan: free
    databaseName: baku_coffee_factory
    user: baku_coffee_factory

