<!doctype html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sifarişlər — Baku Coffee Factory</title>
  <link rel="stylesheet" href="admin.css" />
  <style>
    .orders-main{max-width:1150px;margin:auto;padding:40px}.orders-heading{display:flex;align-items:center;justify-content:space-between;gap:20px}.orders-heading h1{font:500 48px Georgia,serif;margin:8px 0 28px}.orders-heading a{color:#493224;text-decoration:none}.orders-toolbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:0 0 18px;flex-wrap:wrap}.orders-toolbar label{display:flex;align-items:center;gap:10px;font-weight:600}.orders-toolbar select{min-width:190px;padding:11px 38px 11px 12px;border:1px solid #cfc3b5;background:#fffdf8}.orders-list{display:grid;gap:16px}.order-card{background:#fffdf8;border:1px solid #dfd5c9;padding:22px;transition:box-shadow .3s,background-color .3s}.order-card.shipped{border-color:#93a18d;background:#f7faf5}.order-top{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #e4d9cd;padding-bottom:14px}.order-top h2{font:600 20px Georgia,serif;margin:0 0 6px}.order-top time{color:#766a61;font-size:12px}.order-top strong{font-size:20px}.order-contact{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin:18px 0}.order-contact a{color:#492f21}.order-status{border-radius:999px;padding:8px 12px;background:#eee5da;font-weight:700}.order-status.shipped{background:#dbe7d7;color:#365436}.order-status-action{margin-left:auto;border:1px solid #6c7f65;background:#6c7f65;color:white;padding:10px 14px;cursor:pointer;font-weight:700}.order-status-action.undo{background:white;color:#493224;border-color:#bcae9e}.order-status-action:disabled{opacity:.55;cursor:wait}.order-items{display:grid;gap:10px;list-style:none;padding:0}.order-items li{display:flex;align-items:center;gap:12px}.order-items img{width:48px;height:48px;object-fit:cover}.order-items span{flex:1}.order-note{border-left:3px solid #a75d3e;padding:10px 14px;background:#f5eee5;white-space:pre-wrap}.order-error{color:#a63126}.orders-empty{color:#72655a}
    .live-badge{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:#23612f;background:#e9f5ec;padding:5px 12px;border-radius:999px;border:1px solid #bce1c5}
    .live-dot{width:8px;height:8px;border-radius:50%;background:#2e7d32;display:inline-block;animation:livePulse 2s infinite}
    @keyframes livePulse{0%{transform:scale(0.9);box-shadow:0 0 0 0 rgba(46,125,50,0.8)}70%{transform:scale(1);box-shadow:0 0 0 6px rgba(46,125,50,0)}100%{transform:scale(0.9);box-shadow:0 0 0 0 rgba(46,125,50,0)}}
    @keyframes orderArrivedFlash{0%{background:#e8f5e9;border-color:#2e7d32;box-shadow:0 4px 18px rgba(46,125,50,0.25)}100%{background:#fffdf8;border-color:#dfd5c9;box-shadow:none}}
    .order-card.newly-arrived{animation:orderArrivedFlash 3.5s ease-out}
    .refresh-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;background:#fffdf8;border:1px solid #cfc3b5;border-radius:6px;font-size:13px;font-weight:600;color:#493224;cursor:pointer}
    .refresh-btn:hover{background:#f3e9dc}
    @media(max-width:700px){.orders-main{padding:22px 12px 40px}.orders-heading{align-items:flex-start;flex-direction:column;gap:4px}.orders-heading h1{font-size:38px;margin-bottom:12px}.orders-heading a{min-height:44px;display:inline-flex;align-items:center}.orders-toolbar{align-items:stretch;flex-direction:column;gap:10px}.orders-toolbar label{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr)}.orders-toolbar select{width:100%;min-width:0;min-height:46px}.order-card{padding:16px 14px}.order-top{flex-direction:column;gap:8px}.order-top h2{overflow-wrap:anywhere}.order-contact{align-items:stretch;display:grid;grid-template-columns:1fr;gap:10px}.order-status{justify-self:start}.order-status-action{margin-left:0;width:100%;min-height:46px}.order-items li{display:grid;grid-template-columns:48px minmax(0,1fr);align-items:center;gap:8px 12px}.order-items img{grid-row:1/3}.order-items span{min-width:0;overflow-wrap:anywhere}.order-items li>strong{grid-column:2;justify-self:start}.order-note{margin-top:14px}}
  </style>
</head>
<body>
  <main class="orders-main">
    <div class="orders-heading">
      <div><p class="eyebrow">İDARƏETMƏ</p><h1>Sifariş sorğuları</h1></div>
      <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;">
        <span class="live-badge" title="Səhifəni yeniləməyə ehtiyac yoxdur. Sayta yeni sifariş gələndə avtomatik olaraq bir neçə saniyəyə bura düşür."><span class="live-dot"></span> Canlı rejim (Avto-yenilənir)</span>
        <button type="button" class="refresh-btn" id="manualRefreshBtn">🔄 İndi yoxla</button>
        <a href="analytics.html">📊 İstatistiklər</a>
        <a href="./">← Məhsullara qayıt</a>
      </div>
    </div>
    <div class="orders-toolbar"><p id="ordersMessage" role="status">Sifarişlər yüklənir…</p><label for="orderStatusFilter">Status<select id="orderStatusFilter"><option value="all">Hamısı</option><option value="new">Göndərilməyib</option><option value="shipped">Göndərildi</option></select></label></div>
    <div class="orders-list" id="ordersList"></div>
  </main>
  <script src="orders.js"></script>
</body>
</html>
